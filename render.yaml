services:
  - type: web
    name: terrace-wars-multiplayer
    runtime: node
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    plan: free

  - type: web
    name: terrace-wars-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_MULTIPLAYER_URL
        value: wss://terrace-wars-multiplayer.onrender.com
